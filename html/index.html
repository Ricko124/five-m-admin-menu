<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuxuAdmin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="hidden">
    <header>
      <h1>LuxuAdmin Menü</h1>
      <button id="closeBtn" class="ghost">✕</button>
    </header>

    <section class="grid">
      <article>
        <h2>Spieler</h2>
        <label>Spieler-ID <input id="kickId" type="number" placeholder="z. B. 12" /></label>
        <label>Grund <input id="kickReason" type="text" placeholder="Regelverstoß" /></label>
        <button id="kickBtn">Spieler kicken</button>
      </article>

      <article>
        <h2>Server</h2>
        <label>Announcement <input id="announceMessage" type="text" placeholder="Nachricht an alle" /></label>
        <button id="announceBtn">Senden</button>

        <label>Wetter
          <select id="weatherType">
            <option>CLEAR</option>
            <option>EXTRASUNNY</option>
            <option>CLOUDS</option>
            <option>RAIN</option>
            <option>THUNDER</option>
            <option>SMOG</option>
          </select>
        </label>
        <button id="weatherBtn">Wetter setzen</button>

        <div class="row">
          <label>Stunde <input id="timeHour" type="number" min="0" max="23" value="12" /></label>
          <label>Minute <input id="timeMinute" type="number" min="0" max="59" value="0" /></label>
        </div>
        <button id="timeBtn">Uhrzeit setzen</button>
      </article>

      <article>
        <h2>Schnellaktionen</h2>
        <button id="healBtn">Selbst heilen</button>
        <button id="reviveBtn">Selbst wiederbeleben</button>
        <button id="tpBtn">Zum Wegpunkt teleportieren</button>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
